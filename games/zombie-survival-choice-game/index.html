<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A dark text-based zombie survival RPG built with HTML, CSS, and vanilla JavaScript."
    />
    <title>Zombie Survival Choice Game</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <link rel="canonical" href="https://fazal305.github.io/zombie-survival-choice-game/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/zombie-survival-choice-game/" />
    <meta property="og:title" content="Zombie Survival Choice Game" />
    <meta
      property="og:description"
      content="A dark text-based zombie survival RPG built with HTML, CSS, and vanilla JavaScript."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zombie Survival Choice Game" />
    <meta
      name="twitter:description"
      content="A dark text-based zombie survival RPG built with HTML, CSS, and vanilla JavaScript."
    />

    <link rel="stylesheet" href="zombie-styles.css" />
  </head>
  <body>
    <main class="game-page">
      <section
        class="game-card"
        id="gameCard"
        aria-labelledby="sceneTitle"
        aria-describedby="sceneDescription"
        aria-live="polite"
      >
        <div class="stats-bar" aria-label="Player stats">
          <div class="stat-pill">
            Health:
            <span id="healthStat">100</span>
          </div>

          <div class="stat-pill">
            Ammo:
            <span id="ammoStat">5</span>
          </div>

          <div class="stat-pill">
            Days:
            <span id="daysStat">0</span>
          </div>
        </div>

        <div class="scene-content">
          <p class="game-label">Zombie Survival Choice Game</p>

          <h1 id="sceneTitle">Loading...</h1>

          <p id="sceneDescription">Please wait...</p>
        </div>

        <div class="choices-box" id="choicesBox"></div>
      </section>
    </main>

    <script src="zombie-script.js"></script>
  </body>
</html>
