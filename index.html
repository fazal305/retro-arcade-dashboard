<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro Arcade Dashboard</title>
    <meta
      name="description"
      content="A neon retro arcade dashboard with fake games, coins, high scores, sound effects, and localStorage persistence."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="arcade-styles.css" />
  </head>
  <body>
    <div class="scanlines"></div>

    <header class="top-marquee">
      <div class="marquee-track">
        <span id="marqueeText">
          INSERT COIN / PRESS START / HIGH SCORE: 00000 /
        </span>
      </div>
    </header>

    <main class="dashboard-container">
      <section class="hero-section">
        <div>
          <p class="system-status">ARCADE SYSTEM ONLINE</p>

          <h1 class="main-title">Retro Arcade Dashboard</h1>

          <p class="hero-description">
            Neon machines. Fake high scores. Pure retro chaos.
          </p>
        </div>

        <div class="coin-panel">
          <div class="coin-header">
            <span>COINS</span>
            <strong id="coinCount">3</strong>
          </div>

          <p id="coinMessage"></p>

          <button id="addCoinsBtn" class="add-coins-btn" type="button">
            Add Coins
          </button>
        </div>
      </section>

      <section class="main-layout">
        <div class="game-section">
          <div class="section-heading">
            <h2>Game Machines</h2>
          </div>

          <div id="gameGrid" class="game-grid"></div>
        </div>

        <aside class="scoreboard-panel">
          <div class="scoreboard-header">
            <h2>Top Scores</h2>

            <button id="resetScoresBtn" class="reset-btn" type="button">
              Reset
            </button>
          </div>

          <ol id="scoreboardList" class="scoreboard-list"></ol>
        </aside>
      </section>
    </main>

    <script src="arcade-script.js"></script>
  </body>
</html>
